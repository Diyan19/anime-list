name: Anime List CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuous-integration:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build Ionic application
        run: npm run build

  deploy:
    needs: continuous-integration
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t anime-list-ionic-web:latest .

      - name: Remove previous container
        run: docker rm -f anime-list-cicd
        continue-on-error: true

      - name: Start updated container
        run: docker run -d --name anime-list-cicd --restart unless-stopped -p 8100:80 anime-list-ionic-web:latest

      - name: Verify application
        shell: powershell
        run: |
          $success = $false
          for ($i = 1; $i -le 15; $i++) {
            try {
              Invoke-WebRequest http://localhost:8100/ -UseBasicParsing -TimeoutSec 2 | Out-Null
              $success = $true
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $success) {
            docker logs anime-list-cicd
            exit 1
          }
